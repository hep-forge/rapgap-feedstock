{% set versions = {
  "3.4.0": "114f77b9fad95ee9fb95a5104a04e8498b65a98a",
  "3.310": "5c37f255e9957d1fe6c66124c1f28ec4a8baa672"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}

{% set parts = version.split('.') | map('int') | list %}
{% set major = parts[0] %}
{% set minor = parts[1] if parts|length > 1 else 0 %}
{% set patch = parts[2] if parts|length > 2 else 0 %}

{% set name = environ.get('ANACONDA_PACKAGE', "rapgap")|string|lower %}

package:
  name: {{ name }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}
{% set root_tag = (root or '')|replace('.', '') %}

build:
  number: 2
  string: "root{{ root_tag }}"
  # No ROOT dictionary generation currently, but this links against ROOT
  # and could grow one -- pre-emptive protection against conda-build's
  # prefix-relocation corrupting a future lib/*.pcm, matching
  # root-feedstock/root-plus-feedstock's fix for the identical artifact.
  ignore_prefix_files:
    - lib/*.pcm
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x.x") }}

source:
  git_url: "https://gitlab.cern.ch/jung/rapgap"
  git_rev: {{ versions.get(version, "HEAD") }}
  patches:
{% if minor != 310 %}
    - patches/cmake-cxx-standard.patch
{% endif %}
    # Pion-exchange flux from the steering file (IPFF, PIRN, PIGP, PILM,
    # PIAL; defaults = the former hard-coded light-cone flux, R = 0.93).
    - patches/pion-flux-steering.patch
    # Lambda_QCD for Pythia's alpha_s: 'ILAM' 1 = the set's AlphaS_Lambda4,
    # computed from its alpha_s when the info file lacks it; 2 = always
    # solved from the set's alpha_s at 3 GeV.
    - patches/lambda-qcd-from-alphas.patch

requirements:
  build:
    # Only the Fortran compiler was declared, but this package also
    # compiles C++ (its published artifact carries a libstdcxx run
    # dependency), so that half was built by whatever toolchain happened
    # to exist on the CI runner rather than a conda one. c_stdlib and
    # c_stdlib_version were inert too -- they apply only through a
    # {{ stdlib('c') }} reference -- so the sysroot 2.17 ABI floor this
    # feedstock appeared to have never reached its binaries.
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - root {{ root }}.*
    - {{ compiler("fortran") }}
    - gnuconfig
    - make
    - cmake<4
    - automake
    - autoconf
    - libtool

  host:
    - hepmc * root{{ root_tag }}
    - rivet<4 root{{ root_tag }}
    - lhapdf
    - pythia
  run:
    - hepmc * root{{ root_tag }}
    - rivet<4 root{{ root_tag }}
    - lhapdf
    - pythia

about:
  home: "https://rapgap.hepforge.org"
  license: "GPL-3.0"
  summary: "Hadron level Monte Carlo generator for ep and selected processes in pp scattering"
  description: |
    The Monte Carlo program RAPGAP generates a full hadron event record according to the HEP common standards. 
    In ep it can describe all inclusive and diffractive processes, in pp it is available for single-diffractive
    and a few inclusive processes for heavy quark and jet production.

extra:
  recipe-maintainers:
    - meiyasan
